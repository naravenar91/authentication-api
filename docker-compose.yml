version: '3.8'

services:
  # ══════════════════════════════════════════════════════════
  # CONSUL - Service Discovery
  # ══════════════════════════════════════════════════════════
  consul:
    image: hashicorp/consul:1.18
    container_name: consul-server
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - "8500:8500"    # UI & API
      - "8600:8600/udp" # DNS
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════════════════
  # POSTGRES DATABASE
  # ══════════════════════════════════════════════════════════
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-auth-db
    environment:
      - POSTGRES_DB=auth_api_db
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_password
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/postgres:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_api_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════════════════
  # AUTH-API - Spring WebFlux + Consul
  # ══════════════════════════════════════════════════════════
  auth-api:
    build: .
    container_name: auth-api
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      # Database
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres-db:5432/auth_api_db
      - SPRING_R2DBC_USERNAME=auth_user
      - SPRING_R2DBC_PASSWORD=auth_password
      
      # Admin inicial
      - ADMIN_USER_ID=admin
      - ADMIN_PASSWORD=Admin1234
      - ADMIN_UUID=a1b2c3d4-0000-0000-0000-000000000001
      
      # Consul Configuration
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED=true
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge

volumes:
  postgres_data: